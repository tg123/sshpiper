name: E2E

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    
jobs:

  E2E:
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Kind Warmup
      run: kind create cluster -n sshpipertest
      
    - name: Run E2E
      run: docker compose up --build --abort-on-container-exit --exit-code-from testrunner
      working-directory: e2e
      env:
        COMPOSE_DOCKER_CLI_BUILD: "1"
        DOCKER_BUILDKIT: "1"

  windows:
    name: Windows E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Use Linux-compatible line endings for Compose mounts
      run: git config --global core.autocrlf false

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up WSL2 and Linux Docker
      uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
      with:
        distribution: Ubuntu-24.04
        wsl-version: 2
        additional-packages: docker.io docker-compose-v2

    - name: Start Linux Docker
      shell: wsl-bash {0}
      run: |
        service docker start
        timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          cmd/sshpiperd/go.sum

    - name: Run native Windows E2E against Compose
      run: .\e2e\windows\run.ps1
      env:
        CGO_ENABLED: "0"
        GOWORK: "off"

  macos:
    name: macOS E2E
    # Hosted Apple Silicon runners cannot run the Linux VM used by Colima.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          cmd/sshpiperd/go.sum

    - name: Install Docker tools
      # Homebrew builds these from source on Intel, consuming the job timeout.
      env:
        LIMA_VERSION: "2.2.1"
        COLIMA_VERSION: "0.10.3"
        DOCKER_VERSION: "29.8.2"
        COMPOSE_VERSION: "5.6.0"
      run: |
        tools="$RUNNER_TEMP/sshpiper-docker"
        mkdir -p "$tools/bin" "$HOME/.docker/cli-plugins"
        curl -fsSL --retry 3 "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Darwin-x86_64.tar.gz" |
          tar -xz -C "$tools"
        curl -fsSL --retry 3 "https://github.com/abiosoft/colima/releases/download/v${COLIMA_VERSION}/colima-Darwin-x86_64" -o "$tools/bin/colima"
        curl -fsSL --retry 3 "https://download.docker.com/mac/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz" |
          tar -xz -C "$tools"
        install -m 755 "$tools/docker/docker" "$tools/bin/docker"
        curl -fsSL --retry 3 "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-darwin-x86_64" -o "$HOME/.docker/cli-plugins/docker-compose"
        chmod +x "$tools/bin/colima" "$HOME/.docker/cli-plugins/docker-compose"
        echo "$tools/bin" >> "$GITHUB_PATH"

    - name: Start Linux Docker
      run: |
        colima start --cpu 2 --memory 2 --arch x86_64 --vm-type vz --mount-type virtiofs
        docker info
        docker compose version

    - name: Run native macOS E2E against Compose
      run: bash e2e/macos/run.sh
