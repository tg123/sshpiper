name: E2E

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    
jobs:

  E2E:
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Kind Warmup
      run: kind create cluster -n sshpipertest
      
    - name: Run E2E
      run: docker compose up --build --abort-on-container-exit --exit-code-from testrunner
      working-directory: e2e
      env:
        COMPOSE_DOCKER_CLI_BUILD: "1"
        DOCKER_BUILDKIT: "1"

  windows:
    name: Windows E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - name: Use Linux-compatible line endings for Compose mounts
      run: git config --global core.autocrlf false

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up WSL2 and Linux Docker
      uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
      with:
        distribution: Ubuntu-24.04
        wsl-version: 2
        additional-packages: docker.io docker-compose-v2

    - name: Start Linux Docker
      shell: wsl-bash {0}
      run: |
        service docker start
        timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          cmd/sshpiperd/go.sum

    - name: Run native Windows E2E against Compose
      run: .\e2e\windows\run.ps1
      env:
        CGO_ENABLED: "0"
        GOWORK: "off"

  macos:
    name: macOS E2E
    # Hosted Apple Silicon runners cannot run the Linux VM used by Colima.
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          cmd/sshpiperd/go.sum

    - name: Set up Docker and Compose
      uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48 # v1
      with:
        colima-additional-options: --cpu 2 --memory 2

    - name: Run native macOS E2E against Compose
      run: bash e2e/macos/run.sh
