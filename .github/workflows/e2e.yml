name: E2E

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    
jobs:

  E2E:
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Kind Warmup
      run: kind create cluster -n sshpipertest
      
    - name: Run E2E
      run: docker compose up --build --abort-on-container-exit --exit-code-from testrunner
      working-directory: e2e
      env:
        COMPOSE_DOCKER_CLI_BUILD: "1"
        DOCKER_BUILDKIT: "1"

  windows:
    name: Windows E2E
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          cmd/sshpiperd/go.sum

    - name: Run native Windows E2E
      run: go test -v -count=1 -tags e2e -timeout 10m .\e2e\windows
      env:
        CGO_ENABLED: "0"
        GOWORK: "off"
