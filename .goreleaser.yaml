# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # Build the embedded sshpiperd-webadmin frontend before any go build.
    # Requires Node.js 18+ and npm on the host.
    - npm --prefix cmd/sshpiperd-webadmin/internal/httpapi/web ci
    - npm --prefix cmd/sshpiperd-webadmin/internal/httpapi/web run build
builds:
  - id: plugin_workingdir
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/workingdir
    binary: plugins/workingdir
    flags:
      - &trimpath_flag -trimpath
    ldflags:
      - &strip_ldflags -s -w
    tags:
      - full
  - id: plugin_yaml
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/yaml
    binary: plugins/yaml
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_docker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      # - windows
      # - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/docker
    binary: plugins/docker
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_kubernetes
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      # - windows
      # - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/kubernetes
    binary: plugins/kubernetes
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_fixed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/fixed
    binary: plugins/fixed
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_revtunnel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/revtunnel
    binary: plugins/revtunnel
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_failtoban
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/failtoban
    binary: plugins/failtoban
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_username_router
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/username-router
    binary: plugins/username-router
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_lua
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/lua
    binary: plugins/lua
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: plugin_metrics
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./plugin/metrics
    binary: plugins/metrics
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
    tags:
      - full
  - id: sshpiperd_webadmin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/sshpiperd-webadmin
    binary: sshpiperd-webadmin
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
      - -X main.mainver={{.Version}}
    tags:
      - full
  - id: sshpiperd_admin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/sshpiperd-admin
    binary: sshpiperd-admin
    flags:
      - *trimpath_flag
    ldflags:
      - *strip_ldflags
      - -X main.mainver={{.Version}}
    tags:
      - full

archives:
  - formats: ['tar.gz']
    allow_different_binary_count: true
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      sshpiperd_with_plugins_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ['zip']
    ids:
      - plugin_workingdir
      - plugin_yaml
      - plugin_fixed
      - plugin_failtoban
      - plugin_docker
      - plugin_kubernetes
      - plugin_username_router
      - plugin_lua
      - plugin_metrics
      - plugin_revtunnel
      - sshpiperd_webadmin
      - sshpiperd_admin
    files:
      - LICENSE*
      - README*
      - src: 'native/{{ .Os }}_{{ .Arch }}/sshpiperd{{ if eq .Os "windows" }}.exe{{ end }}'
        dst: .
        strip_parent: true
        info:
          mode: 0755
dockers:
  - image_templates:
      - "farmer1992/sshpiperd:v{{ .Version }}-amd64"
      - "ghcr.io/tg123/sshpiperd:v{{ .Version }}-amd64"
    use: buildx
    ids: 
      - plugin_kubernetes
      - plugin_workingdir
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=EXTERNAL=1"
    extra_files: &docker_extra_files
      - native/linux_amd64/sshpiperd
      - native/linux_arm64/sshpiperd
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - image_templates:
      - "farmer1992/sshpiperd:v{{ .Version }}-arm64"
      - "ghcr.io/tg123/sshpiperd:v{{ .Version }}-arm64"
    use: buildx
    ids: 
      - plugin_kubernetes
      - plugin_workingdir
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=EXTERNAL=1"
    extra_files: *docker_extra_files
    skip_push: "{{ .Env.SKIP_PUSH }}"
  # full
  - image_templates:
      - "farmer1992/sshpiperd:full-v{{ .Version }}-amd64"
      - "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=EXTERNAL=1"
    extra_files: *docker_extra_files
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - image_templates:
      - "farmer1992/sshpiperd:full-v{{ .Version }}-arm64"
      - "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=EXTERNAL=1"
    extra_files: *docker_extra_files
    skip_push: "{{ .Env.SKIP_PUSH }}"
docker_manifests:
  - name_template: "farmer1992/sshpiperd:v{{ .Version }}"
    image_templates:
      - "farmer1992/sshpiperd:v{{ .Version }}-amd64"
      - "farmer1992/sshpiperd:v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - name_template: "farmer1992/sshpiperd:latest"
    image_templates:
      - "farmer1992/sshpiperd:v{{ .Version }}-amd64"
      - "farmer1992/sshpiperd:v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - name_template: "ghcr.io/tg123/sshpiperd:latest"
    image_templates:
      - "ghcr.io/tg123/sshpiperd:v{{ .Version }}-amd64"
      - "ghcr.io/tg123/sshpiperd:v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - name_template: "ghcr.io/tg123/sshpiperd:v{{ .Version }}"
    image_templates:
      - "ghcr.io/tg123/sshpiperd:v{{ .Version }}-amd64"
      - "ghcr.io/tg123/sshpiperd:v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  # full
  - name_template: "farmer1992/sshpiperd:full-v{{ .Version }}"
    image_templates:
      - "farmer1992/sshpiperd:full-v{{ .Version }}-amd64"
      - "farmer1992/sshpiperd:full-v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - name_template: "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}"
    image_templates:
      - "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}-amd64"
      - "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - name_template: "farmer1992/sshpiperd:full"
    image_templates:
      - "farmer1992/sshpiperd:full-v{{ .Version }}-amd64"
      - "farmer1992/sshpiperd:full-v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
  - name_template: "ghcr.io/tg123/sshpiperd:full"
    image_templates:
      - "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}-amd64"
      - "ghcr.io/tg123/sshpiperd:full-v{{ .Version }}-arm64"
    skip_push: "{{ .Env.SKIP_PUSH }}"
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: 'devel-{{ slice .FullCommit 0 12 }}'
release:
  draft: true
  replace_existing_draft: true
  disable: true

snapcrafts:
  - ids:
      - plugin_workingdir
      - plugin_yaml
      - plugin_fixed
      - plugin_failtoban
      - plugin_username_router
      - plugin_lua
    name: sshpiperd
    name_template: "sshpiperd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    summary: The missing reverse proxy for ssh scp
    description: |
      sshpiperd is a reverse proxy for ssh/scp. It allows you to have a single
      ssh key pair for all your servers, behind a single IP address. It also
      allows you to connect to internal servers without exposing them to the
      internet.
    publish: true
    grade: stable
    confinement: strict
    license: MIT
    apps:
      sshpiperd:
        command: launcher
        plugs: [network-bind] 
        daemon: simple
    channel_templates:
      - beta
      - stable
    extra_files:
      - source: packaging/snap/configure
        destination: meta/hooks/configure
        mode: 0755
      - source: packaging/snap/launcher
        destination: launcher
        mode: 0755
      # OSS GoReleaser does not template extra-file sources by architecture.
      # The launcher execs the matching native binary, without a Go wrapper.
      - source: native/linux_amd64/sshpiperd
        destination: libexec/sshpiperd-amd64
        mode: 0755
      - source: native/linux_arm64/sshpiperd
        destination: libexec/sshpiperd-arm64
        mode: 0755
    hooks:
      configure:
        plugs: [home]
