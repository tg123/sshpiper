[package]
name = "sshpiper-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["mlkem768", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17"
sha2 = "0.10"
signature = "2"
ssh-encoding = "0.2"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "p521", "rand_core"] }
rsa = { version = "0.9", features = ["sha2"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
x25519-dalek = "2"
zeroize = "1"

[dev-dependencies]
aes-gcm = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
[target.'cfg(target_arch = "x86_64")'.dependencies]
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["simd256"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
libcrux-ml-kem = { version = "0.0.11", default-features = false, features = ["simd128"] }
